<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
	<!-- Se reutiliza la tarjeta de servicio en el inicio y en el catálogo (diseño del prototipo) -->
	<div th:fragment="tarjeta(s)" class="tarjeta-salon p-4 h-100 d-flex flex-column">
		<h3 class="h5 fw-bold mb-1" th:text="${s.nombre}">Corte y peinado</h3>
		<p class="small text-secundario flex-grow-1 mb-3" th:text="${s.descripcion}">Descripción del servicio</p>
		<div class="d-flex align-items-center justify-content-between">
			<span class="small text-secundario"><i class="bi bi-clock me-1"></i><span th:text="${s.duracionMin} + ' min'">60 min</span></span>
			<span class="h5 fw-bold text-primario mb-0"
				th:text="'$' + ${#numbers.formatDecimal(s.precio, 1, 'COMMA', 2, 'POINT')}">$350.00</span>
		</div>
	</div>
</body>
</html>
