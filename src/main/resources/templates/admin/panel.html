<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Panel')}"></head>
<body>
	<nav th:replace="~{fragments/admin :: nav('inicio')}"></nav>

	<main class="container py-4">
		<h1 class="h2 mb-1">Hola, <span th:text="${usuario}">dueña</span></h1>
		<p class="text-secundario mb-4">Desde aquí administras tu agenda, servicios, horario y días inhábiles.</p>

		<div class="row g-3">
			<!-- Se enlaza el módulo de servicios, que ya está disponible -->
			<div class="col-6 col-md-3">
				<a th:href="@{/admin/servicios}" class="tarjeta-salon tarjeta-enlace p-3 h-100 d-block text-decoration-none text-reset">
					<i class="bi bi-scissors fs-4 text-primario"></i>
					<div class="fw-bold mt-2">Servicios</div>
					<div class="small text-secundario">Precios y duración</div>
				</a>
			</div>
			<div class="col-6 col-md-3">
				<a th:href="@{/admin/horario}" class="tarjeta-salon tarjeta-enlace p-3 h-100 d-block text-decoration-none text-reset">
					<i class="bi bi-clock fs-4 text-primario"></i>
					<div class="fw-bold mt-2">Horario</div>
					<div class="small text-secundario">Días y horas de trabajo</div>
				</a>
			</div>
			<div class="col-6 col-md-3">
				<a th:href="@{/admin/bloqueos}" class="tarjeta-salon tarjeta-enlace p-3 h-100 d-block text-decoration-none text-reset">
					<i class="bi bi-calendar-x fs-4 text-primario"></i>
					<div class="fw-bold mt-2">Días inhábiles</div>
					<div class="small text-secundario">Descansos y vacaciones</div>
				</a>
			</div>
			<!-- Se listan los módulos que se construirán en los siguientes sprints -->
			<div class="col-6 col-md-3" th:each="modulo : ${ {'Agenda'} }">
				<div class="tarjeta-salon p-3 h-100 opacity-75">
					<i class="bi bi-hourglass-split fs-4 text-secundario"></i>
					<div class="fw-bold mt-2" th:text="${modulo}">Módulo</div>
					<div class="small text-secundario">Próximamente</div>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
