spring.application.name=salon-citas

# Se cargan las variables del archivo .env de la raíz del proyecto (si existe)
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL; las credenciales vienen de variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:salon_citas}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo controla Flyway; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# No se configura hibernate.jdbc.time_zone: las fechas (DATE) y horas (TIME) del salón son locales
# y no deben convertirse según la zona horaria del servidor (en la nube suele ser UTC)

# Cuenta inicial de la dueña: se crea al arrancar si no existe (ver CuentaInicialInitializer)
salon.admin.usuario=${ADMIN_USUARIO:admin}
salon.admin.password=${ADMIN_PASSWORD:}
salon.admin.nombre=${ADMIN_NOMBRE:Administradora}
