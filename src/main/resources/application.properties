spring.application.name=salon-citas

# Se cargan las variables del archivo .env de la raíz del proyecto (si existe)
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL; las credenciales vienen de variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:salon_citas}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo controla Flyway; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Se usa la zona horaria del salón para fechas y horas
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
